name: Tests

on:
  pull_request:
    branches: [main]
    # No path filter: this workflow gates merges as a required status check, and a
    # required check that never reports (a docs-only pull request) blocks it for good.
  workflow_dispatch:
  schedule:
    # Post-merge drift check on the default branch (weekly, never a branch push).
    - cron: '41 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    uses: laranail/.github/.github/workflows/tests.yml@main
    with:
      # Resolve whatever composer.json allows rather than letting the shared workflow
      # rewrite composer.json to a pinned Laravel line.
      laravel-versions: '["*"]'
      php-extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite'
      test-command: 'vendor/bin/pest'

  # The shared workflow runs on SQLite only, so the `database` test group runs again here on
  # MySQL and Postgres service containers. Their passwords are throwaway literals: GitHub starts
  # services before any step, so they cannot come from a generator.
  databases:
    name: Database group · ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: throwaway
          MYSQL_DATABASE: settings
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pthrowaway"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: settings
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: settings
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: throwaway
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_mysql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the database group
        run: vendor/bin/pest --group=database

  # §13: the full product of the schema switches (1,152 shapes, tenancy included) on SQLite, weekly and on demand.
  # Pull requests run the pairwise set (10 shapes) inside the jobs above.
  matrix-full:
    name: Schema switches · full product
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LARANAIL_SETTINGS_MATRIX: full
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the full switch matrix
        run: vendor/bin/pest --group=matrix
