name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

  # The OSV scan and the secret scan this repository has never had. The local `audit` job above is
  # deliberately left alone: it caches composer and pins its own PHP, which the shared workflow does
  # not, and its `composer update` audit covers dev dependencies that the shared job's
  # `--locked --no-dev` skips. The two are not duplicates; neither is a superset of the other.
  shared:
    name: shared scans (OSV, secrets)
    uses: laranail/.github/.github/workflows/security.yml@main
    with:
      php-version: '8.5'
      php-extensions: 'dom, curl, libxml, mbstring, zip, fileinfo'
    # Carries OP_SERVICE_ACCOUNT_TOKEN through for the ggshield step. The shared workflow declares it
    # optional and skips with a warning when absent, so this is correct before the credential exists.
    secrets: inherit
